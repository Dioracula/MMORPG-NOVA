<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMO Protótipo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:sans-serif;touch-action:none}
  #hud{position:fixed;top:8px;left:8px;color:#fff;font-size:13px;z-index:2;text-shadow:0 1px 2px #000}
  #joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#ffffff22;display:none;z-index:2;touch-action:none}
  #knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff88}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">Conectando…</div>
<div id="joy"><div id="knob"></div></div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- Cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8);
scene.fog = new THREE.Fog(0x87b8e8, 30, 120);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
const rig = new THREE.Group();      // "corpo" do jogador no mundo (usado no VR)
rig.add(cam);
scene.add(rig);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10, 20, 5);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x4a8c4a }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground, new THREE.GridHelper(100, 50, 0x000000, 0x2f6b2f));

// Controles do Quest (esferas nas mãos; rastreamento de mão real vem depois)
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.add(new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshStandardMaterial({ color: 0xffcc00 })));
  rig.add(c);
}

function makeAvatar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.8;
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.3), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.position.set(0, 1.3, -0.3);
  g.add(body, nose);
  scene.add(g);
  return g;
}

// ---------- Rede ----------
const hud = document.getElementById('hud');
const avatars = new Map();   // id -> { g, tx, tz, try }
let myId = null;
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name: prompt('Nome do herói?') || 'Herói' }));
ws.onclose = () => (hud.textContent = 'Desconectado');
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') myId = m.id;
  if (m.t === 'state') {
    const seen = new Set();
    for (const p of m.players) {
      seen.add(p.id);
      let a = avatars.get(p.id);
      if (!a) { a = { g: makeAvatar(p.color), tx: p.x, tz: p.z, ry: p.ry }; a.g.position.set(p.x, 0, p.z); avatars.set(p.id, a); }
      a.tx = p.x; a.tz = p.z; a.ry = p.ry;
    }
    for (const [id, a] of avatars) if (!seen.has(id)) { scene.remove(a.g); avatars.delete(id); }
    hud.textContent = 'Jogadores online: ' + m.players.length + ' | WASD/joystick, arraste para girar';
  }
};

// ---------- Entrada (PC, celular, Quest) ----------
let yaw = 0;
const keys = {};
const joy = { x: 0, y: 0 };
addEventListener('keydown', (e) => (keys[e.code] = true));
addEventListener('keyup', (e) => (keys[e.code] = false));
let dragX = null;
renderer.domElement.addEventListener('pointerdown', (e) => (dragX = e.clientX));
addEventListener('pointerup', () => (dragX = null));
addEventListener('pointermove', (e) => { if (dragX !== null) { yaw -= (e.clientX - dragX) * 0.005; dragX = e.clientX; } });

const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
if ('ontouchstart' in window) joyEl.style.display = 'block';
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();
  let x = (e.clientX - r.left - 60) / 50, y = (e.clientY - r.top - 60) / 50;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  joy.x = x; joy.y = y;
  knob.style.left = 40 + x * 40 + 'px'; knob.style.top = 40 + y * 40 + 'px';
}
joyEl.addEventListener('pointerdown', (e) => { joyEl.setPointerCapture(e.pointerId); moveJoy(e); e.stopPropagation(); });
joyEl.addEventListener('pointermove', (e) => { if (joyEl.hasPointerCapture(e.pointerId)) moveJoy(e); });
joyEl.addEventListener('pointerup', () => { joy.x = joy.y = 0; knob.style.left = knob.style.top = '40px'; });

const cur = { dx: 0, dz: 0 };
let snapReady = true;
const v = new THREE.Vector3();

function readInput() {
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  let iz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0) + joy.y;

  if (renderer.xr.isPresenting) {
    const session = renderer.xr.getSession();
    for (const src of session.inputSources) {
      const ax = src.gamepad && src.gamepad.axes;
      if (!ax || ax.length < 4) continue;
      if (src.handedness === 'left') { ix += ax[2]; iz += ax[3]; }          // andar com o direcional esquerdo
      if (src.handedness === 'right') {                                       // giro em passos de 30° (conforto)
        if (Math.abs(ax[2]) > 0.7 && snapReady) { rig.rotation.y -= Math.sign(ax[2]) * Math.PI / 6; snapReady = false; }
        if (Math.abs(ax[2]) < 0.3) snapReady = true;
      }
    }
    cam.getWorldDirection(v);                 // a direção da cabeça define "para frente"
    yaw = Math.atan2(-v.x, -v.z);
  }
  const l = Math.hypot(ix, iz);
  if (l > 1) { ix /= l; iz /= l; }
  cur.dx = ix * Math.cos(yaw) + iz * Math.sin(yaw);
  cur.dz = -ix * Math.sin(yaw) + iz * Math.cos(yaw);
}
setInterval(() => {
  if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'input', dx: cur.dx, dz: cur.dz, ry: yaw }));
}, 50);

// ---------- Loop ----------
renderer.setAnimationLoop(() => {
  readInput();
  for (const a of avatars.values()) {
    a.g.position.x += (a.tx - a.g.position.x) * 0.25;
    a.g.position.z += (a.tz - a.g.position.z) * 0.25;
    a.g.rotation.y += (a.ry - a.g.rotation.y) * 0.25;
  }
  const me = avatars.get(myId);
  if (me) {
    if (renderer.xr.isPresenting) {
      rig.position.set(me.g.position.x, 0, me.g.position.z);
    } else {
      rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
      cam.position.set(me.g.position.x + Math.sin(yaw) * 6, 4, me.g.position.z + Math.cos(yaw) * 6);
      cam.lookAt(me.g.position.x, 1, me.g.position.z);
    }
  }
  renderer.render(scene, cam);
});
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
